# Lumbre — minimal Supabase CLI config
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "hcbqrdxonbezscgzeyyo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["exp://localhost:8081"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
